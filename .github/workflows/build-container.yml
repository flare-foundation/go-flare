name: container-images

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*" ]

jobs:
  build-and-push-matrix:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      USE_DOCKER_HUB: false
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3

    - run: echo "IMAGE_TAG=dev" >> $GITHUB_ENV
      if: github.ref_name == 'main' || startsWith(github.ref_name, 'feature/')
    - run: echo "IMAGE_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
      if: startsWith(github.ref, 'refs/tags/v')

    - name: Detect stable release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        if [[ ! "${GITHUB_REF##*/}" =~ -(rc|alpha|beta|pre) ]]; then
          echo "IS_STABLE=true" >> $GITHUB_ENV
        fi

    - name: Login to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to docker.io
      if: ${{ env.USE_DOCKER_HUB == 'true' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_UID }}
        password: ${{ secrets.DOCKER_HUB_PAT }}

    - name: Build standard image
      run: |
        TAGS="--tag ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}"
        [ "${USE_DOCKER_HUB}" = "true" ] && TAGS="$TAGS --tag ${{ secrets.DOCKER_HUB_REPO }}:${{ env.IMAGE_TAG }}"

        if [ "${IS_STABLE}" = "true" ]; then
          TAGS="$TAGS --tag ghcr.io/${{ github.repository }}:latest"
          [ "${USE_DOCKER_HUB}" = "true" ] && TAGS="$TAGS --tag ${{ secrets.DOCKER_HUB_REPO }}:latest"
        fi

        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --provenance=mode=max \
          --sbom=true \
          $TAGS \
          --file ./Dockerfile \
          --output type=image,push=true \
          --iidfile std.digest \
          .

    - name: Export standard image digest
      run: echo "IMAGE_DIGEST=$(cat std.digest)" >> $GITHUB_ENV

    - name: Build distroless image
      run: |
        TAGS="--tag ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}-dless"
        [ "${USE_DOCKER_HUB}" = "true" ] && TAGS="$TAGS --tag ${{ secrets.DOCKER_HUB_REPO }}:${{ env.IMAGE_TAG }}-dless"

        if [ "${IS_STABLE}" = "true" ]; then
          TAGS="$TAGS --tag ghcr.io/${{ github.repository }}:latest-dless"
          [ "${USE_DOCKER_HUB}" = "true" ] && TAGS="$TAGS --tag ${{ secrets.DOCKER_HUB_REPO }}:latest-dless"
        fi

        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --provenance=mode=max \
          --sbom=true \
          $TAGS \
          --file ./Dockerfile.dless \
          --output type=image,push=true \
          --iidfile dless.digest \
          .

    - name: Export distroless image digest
      run: echo "DLESS_IMAGE_DIGEST=$(cat dless.digest)" >> $GITHUB_ENV

    - name: Attest standard image
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ghcr.io/${{ github.repository }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        push-to-registry: true

    - name: Attest distroless image
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ghcr.io/${{ github.repository }}
        subject-digest: ${{ env.DLESS_IMAGE_DIGEST }}
        push-to-registry: true
