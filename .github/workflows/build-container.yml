name: container-images

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*" ]

permissions: {}

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: standard
          dockerfile: ./Dockerfile
          tag-suffix: ""
        - variant: distroless
          dockerfile: ./Dockerfile.dless
          tag-suffix: -dless
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-image.yml # zizmor: ignore[self-repository] actionlint does not yet support the $/ syntax
    with:
      dockerfile: ${{ matrix.dockerfile }}
      # main / feature/** -> dev, v* tags -> the tag itself
      image-tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
      tag-suffix: ${{ matrix.tag-suffix }}
      use-docker-hub: false
    secrets:
      DOCKER_HUB_UID: ${{ secrets.DOCKER_HUB_UID }}
      DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
      DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_REPO }}
