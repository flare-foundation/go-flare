name: Build Go Binaries For Verification

on:
  workflow_call:
    inputs:
      go_version:
        required: true
        type: string
      ubuntu_version:
        required: true
        type: string
      build_artifact_name:
        required: true
        type: string
    
    outputs:
      build_artifact_name:
        description: "Name of uploaded artifacts"
        value: ${{ inputs.build_artifact_name }}

jobs:
  build:
    runs-on: ubuntu-${{ inputs.ubuntu_version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
  
    - name: Build
      uses: ./.github/actions/go-build # zizmor: ignore[self-repository] actionlint does not yet support the $/ syntax
      with:
        go_version: ${{ inputs.go_version }}
        working_directory: .

    - name: Upload build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.build_artifact_name }}
        path: avalanchego/build/
