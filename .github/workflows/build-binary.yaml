name: binaries

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main", "release/**" ]
    tags: [ "v*" ]

jobs:
  build:
    name: Build go-flare with SLSA
    permissions:
      contents: write
      id-token: write
      packages: write
      actions: read
    uses: ./.github/workflows/build-go-slsa3.yaml # zizmor: ignore[self-repository] actionlint does not yet support the $/ syntax
    with:
      go_version: "1.26.10"
      ubuntu_version: "24.04"
      build_artifact_name: "avalanchego"

  build-verification:
    if: github.ref_type == 'tag'
    name: Go Verification Build
    permissions:
      contents: read
    uses: ./.github/workflows/build-go-verification.yaml # zizmor: ignore[self-repository] actionlint does not yet support the $/ syntax
    with:
      go_version: "1.26.10"
      ubuntu_version: "24.04"
      build_artifact_name: "avalanchego-verification"

  release:
    name: Release
    runs-on: "ubuntu-24.04"
    needs: [build, build-verification]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Install diffoscope
        run: sudo apt-get update -y && sudo apt-get install -y diffoscope-minimal
      
      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Extract artifacts
        run: |
          mkdir -p release/

          tar -xzf artifacts/avalanchego/folder.tgz -C artifacts/avalanchego/
          mv artifacts/avalanchego/binaries/avalanchego release/

          tar -xzf artifacts/avalanchego-attestations/folder.tgz -C artifacts/avalanchego-attestations/
          mv artifacts/avalanchego-attestations/*-slsa-attestations/avalanchego-binaries.build.slsa artifacts/avalanchego.build.slsa

          {
            echo "AVALANCHEGO_BINARY=release/avalanchego"
            echo "AVALANCHEGO_VERIFICATION_BINARY=artifacts/avalanchego-verification/avalanchego"
            echo "SLSA_PROVENANCE=artifacts/avalanchego.build.slsa"
          } >> "$GITHUB_ENV"

      - name: Verify reproducible build
        run: |
          HASH_MAIN=$(sha256sum "${AVALANCHEGO_BINARY}" | awk '{print $1}')
          HASH_VERIFY=$(sha256sum "${AVALANCHEGO_VERIFICATION_BINARY}" | awk '{print $1}')

          if [ "$HASH_MAIN" = "$HASH_VERIFY" ]; then
            echo "Hashes match"
          else
            echo "Hashes don't match"

            diffoscope "${AVALANCHEGO_BINARY}" "${AVALANCHEGO_VERIFICATION_BINARY}" || true

            exit 1
          fi

      - name: Verify SLSA provenance
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            slsa-verifier verify-artifact \
              "${AVALANCHEGO_BINARY}" \
              --provenance-path "${SLSA_PROVENANCE}" \
              --source-uri "github.com/${{ github.repository }}" \
              --builder-id "https://github.com/${{ github.repository }}/.github/workflows/build-go-slsa3.yaml@refs/tags/${GITHUB_REF_NAME}"
          else
            echo "Skipping SLSA verification for non-release tag: ${GITHUB_REF_NAME}"
          fi

      - name: Package release
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          ARTIFACT_NAME="go-flare-${RELEASE_TAG}-linux-amd64.zip"

          cd release
          zip -r "../$ARTIFACT_NAME" .

          mv "../${SLSA_PROVENANCE}" "../$ARTIFACT_NAME.build.slsa"

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Sign release binary
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign-blob --yes \
            --output-signature "${ARTIFACT_NAME}.sig" \
            --output-certificate "${ARTIFACT_NAME}.pem" \
            "${ARTIFACT_NAME}"

      - name: Verify release binary signature
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign verify-blob \
            --certificate "${ARTIFACT_NAME}.pem" \
            --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/build-binary.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --signature "${ARTIFACT_NAME}.sig" \
            "${ARTIFACT_NAME}"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARTIFACT_NAME}"* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ARTIFACT_NAME}"* --verify-tag --notes "TODO"
          fi

      - name: Archive production artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist-bin
          path: |
            ${{ env.ARTIFACT_NAME }}
