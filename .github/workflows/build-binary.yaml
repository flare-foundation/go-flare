name: binaries

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main", "release/**" ]
    tags: [ "v*" ]

jobs:
  build:
    name: Build go-flare (amd64)
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-go.yaml # zizmor: ignore[self-repository] actionlint does not yet support the $/ syntax
    with:
      go_version: "1.26.10"
      ubuntu_version: "26.04"
      build_artifact_name: "avalanchego-amd64"
      attest: true

  build-arm64:
    name: Build go-flare (arm64)
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-go.yaml # zizmor: ignore[self-repository] actionlint does not yet support the $/ syntax
    with:
      go_version: "1.26.10"
      ubuntu_version: "26.04-arm"
      build_artifact_name: "avalanchego-arm64"
      attest: true

  images:
    name: Container images
    needs: [build, build-arm64]
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-container.yml # zizmor: ignore[self-repository] actionlint does not yet support the $/ syntax
    with:
      amd64_artifact_name: "avalanchego-amd64"
      arm64_artifact_name: "avalanchego-arm64"
    secrets:
      DOCKER_HUB_UID: ${{ secrets.DOCKER_HUB_UID }}
      DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
      DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_REPO }}

  build-verification:
    if: github.ref_type == 'tag'
    name: Go Verification Build
    # id-token/attestations only because build-go.yaml declares an attest job; it is skipped
    # here (attest: false) and the build job itself is limited to contents: read.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-go.yaml # zizmor: ignore[self-repository] actionlint does not yet support the $/ syntax
    with:
      go_version: "1.26.10"
      ubuntu_version: "26.04"
      build_artifact_name: "avalanchego-verification"

  release:
    name: Release
    runs-on: "ubuntu-26.04"
    needs: [build, build-arm64, build-verification]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
      attestations: read
    steps:
      - name: Install diffoscope
        run: sudo apt-get update -y && sudo apt-get install -y diffoscope-minimal

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Extract artifacts
        run: |
          mkdir -p release/amd64 release/arm64

          cp artifacts/avalanchego-amd64/avalanchego release/amd64/
          cp artifacts/avalanchego-arm64/avalanchego release/arm64/

          # upload-artifact does not preserve the executable bit
          find release artifacts/avalanchego-verification -type f -exec chmod 755 {} +

          {
            echo "AVALANCHEGO_BINARY=release/amd64/avalanchego"
            echo "AVALANCHEGO_VERIFICATION_BINARY=artifacts/avalanchego-verification/avalanchego"
          } >> "$GITHUB_ENV"

      - name: Verify reproducible build
        run: |
          HASH_MAIN=$(sha256sum "${AVALANCHEGO_BINARY}" | awk '{print $1}')
          HASH_VERIFY=$(sha256sum "${AVALANCHEGO_VERIFICATION_BINARY}" | awk '{print $1}')

          if [ "$HASH_MAIN" = "$HASH_VERIFY" ]; then
            echo "Hashes match"
          else
            echo "Hashes don't match"

            timeout 300 diffoscope "${AVALANCHEGO_BINARY}" "${AVALANCHEGO_VERIFICATION_BINARY}" || true

            exit 1
          fi

      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in amd64 arm64; do
            # Publish the single bundle created by this build, so it verifies on its own (cosign
            # expects exactly one bundle per file).
            shopt -s nullglob
            BUNDLES=("artifacts/avalanchego-${arch}-attestation"/*)
            if [ "${#BUNDLES[@]}" -ne 1 ]; then
              echo "Expected one attestation bundle for ${arch}, found ${#BUNDLES[@]}"
              exit 1
            fi
            cp "${BUNDLES[0]}" "release/${arch}.sigstore.json"

            gh attestation verify "release/${arch}/avalanchego" \
              --bundle "release/${arch}.sigstore.json" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/build-go.yaml" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done

      - name: Package release
        run: |
          for arch in amd64 arm64; do
            ARTIFACT_NAME="go-flare-${GITHUB_REF_NAME}-linux-${arch}.zip"

            # Only the binary, stored at the zip root.
            zip -j "${ARTIFACT_NAME}" "release/${arch}/avalanchego"

            # Attestation bundle for the binary inside the zip, for offline verification.
            mv "release/${arch}.sigstore.json" "${ARTIFACT_NAME}.sigstore.json"
          done

      - name: Sign release binaries
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          for ARTIFACT_NAME in go-flare-"${GITHUB_REF_NAME}"-linux-*.zip; do
            cosign sign-blob --yes \
              --output-signature "${ARTIFACT_NAME}.sig" \
              --output-certificate "${ARTIFACT_NAME}.pem" \
              "${ARTIFACT_NAME}"
          done

      - name: Verify release binary signatures
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          for ARTIFACT_NAME in go-flare-"${GITHUB_REF_NAME}"-linux-*.zip; do
            cosign verify-blob \
              --certificate "${ARTIFACT_NAME}.pem" \
              --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/build-binary.yaml@${GITHUB_REF}" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --signature "${ARTIFACT_NAME}.sig" \
              "${ARTIFACT_NAME}"
          done

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" go-flare-"${GITHUB_REF_NAME}"-linux-* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" go-flare-"${GITHUB_REF_NAME}"-linux-* --verify-tag --notes "TODO"
          fi

      - name: Archive production artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist-bin
          path: |
            go-flare-${{ github.ref_name }}-linux-*.zip
